# Search vocabulary: synonyms and abbreviations.
#
# A contractor searching this product types trade shorthand — "ahu", "rtu", "vav", "split
# system" — while the permit text the sources publish spells the same equipment out in full,
# or the other way around. Without a vocabulary the two never meet and a query that should
# find work returns nothing.
#
# This is configuration, not code. Adding a trade means adding its groups under `trades`, not
# editing the search engine. Two rules this file follows, both asserted by tests:
#
#   1. **A group is a set of equivalent terms.** Every term in a group means the same thing to
#      a search, so a query naming any one of them is expanded to all of them. Do not put
#      terms in one group that a searcher would consider different work.
#   2. **Terms are matched whole.** A term is matched against the query as a whole word or
#      phrase, never as a substring, so "ems" does not fire on "items".
#
# A query term that is not in this file is passed through unchanged, so the vocabulary can only
# widen a search, never silently narrow or redirect one.

version: 1

# Equivalences that apply to every trade.
groups:
  - id: air_handling_unit
    label: "Air handling unit"
    terms: ["ahu", "air handler", "air handling unit", "air handling units", "air-handling unit"]

  - id: rooftop_unit
    label: "Rooftop / packaged unit"
    terms: ["rtu", "rtus", "rooftop unit", "rooftop units", "roof top unit", "packaged unit"]

  - id: variable_air_volume
    label: "Variable air volume"
    terms: ["vav", "variable air volume", "variable-air-volume"]

  - id: variable_refrigerant
    label: "Variable refrigerant flow"
    terms: ["vrf", "vrv", "variable refrigerant flow", "variable refrigerant volume"]

  - id: split_system
    label: "Split system"
    terms: ["split system", "split-system", "mini split", "mini-split"]

  - id: chilled_water
    label: "Chilled water"
    terms: ["chiller", "chillers", "chilled water"]

  - id: cooling_tower
    label: "Cooling tower / condenser water"
    terms: ["cooling tower", "cooling towers", "condenser water"]

  - id: fan_coil
    label: "Fan coil unit"
    terms: ["fcu", "fan coil", "fan coil unit"]

  - id: building_automation
    label: "Building automation / controls"
    terms: ["bms", "ems", "ddc", "building management system", "energy management system", "direct digital control"]

  - id: ductwork
    label: "Ductwork"
    terms: ["ductwork", "duct work", "ducting"]

  - id: heat_pump
    label: "Heat pump"
    terms: ["heat pump", "heat pumps"]

  - id: boiler
    label: "Boiler"
    terms: ["boiler", "boilers"]

  - id: exhaust
    label: "Exhaust"
    terms: ["exhaust", "exhaust fan", "exhaust fans"]

  - id: make_up_air
    label: "Make-up air"
    terms: ["make-up air", "make up air", "makeup air", "mua", "mau"]

  - id: energy_recovery
    label: "Energy recovery / ventilation"
    terms: ["energy recovery", "erv", "hru", "heat recovery", "energy recovery ventilator"]

  - id: unit_heater
    label: "Unit heater"
    terms: ["unit heater", "unit heaters", "gas heater"]

  - id: humidification
    label: "Humidification / dehumidification"
    terms: ["humidifier", "humidification", "dehumidifier", "dehumidification"]

  # Project-type wording. These groups describe the *kind of work*, not a trade: expanding a
  # search for "build-out" to "tenant improvement" widens which records are found, and never
  # asserts a trade. A group is deliberately not merged across different work, so "renovation"
  # does not expand to "build-out" — a contractor treats those as different scopes.
  - id: tenant_improvement
    label: "Tenant improvement / build-out"
    terms: ["tenant improvement", "tenant improvements", "tenant build-out", "tenant buildout",
            "office build-out", "build-out", "buildout", "interior renovation",
            "interior remodel", "finish out"]

  - id: renovation
    label: "Renovation / remodel"
    terms: ["renovation", "renovations", "remodel", "remodeling", "interior renovation work"]

  - id: new_construction
    label: "New construction"
    terms: ["new construction", "ground up", "ground-up", "new build", "new commercial"]

  - id: addition
    label: "Building addition"
    terms: ["addition", "additions", "building addition", "commercial addition"]

  - id: shell_core
    label: "Shell / core and shell"
    terms: ["core and shell", "core & shell", "shell building", "core-shell"]

  # Trade-name shorthand that is not equipment. Kept as separate groups so a query naming one
  # trade never expands to another: "electrical" must not find plumbing.
  - id: electrical_trade
    label: "Electrical (trade synonym)"
    terms: ["power distribution", "switchgear", "switch gear", "panelboard", "panel board",
            "service entrance", "low voltage", "transformer"]

  - id: plumbing_trade
    label: "Plumbing (trade synonym)"
    terms: ["domestic water", "sanitary systems", "sanitary system", "water heater",
            "gas piping", "backflow preventer", "sanitary sewer"]

  # Metro naming. Only the combined metro abbreviation is a group: the individual city names
  # are deliberately *not* interchangeable, so "dallas" never expands to "fort worth".
  - id: dfw_metro
    label: "Dallas–Fort Worth metro"
    terms: ["dfw", "dallas-fort worth", "dallas fort worth", "metroplex"]

# Per-trade additions, merged with the global groups above. A trade that introduces its own
# equipment adds a group here rather than touching the engine.
trades:
  commercial_hvac:
    - id: mechanical
      label: "Mechanical / HVAC (trade synonym)"
      terms: ["mechanical", "hvac", "mechanical scope", "mechanical work"]
