# Render blueprint for the BuildScope web service.
#
# Deploy with "New > Blueprint" and point Render at this repository; it reads this file.
# The same container also runs the online-search refresh loop, so there is no separate worker,
# cron job or external scheduler to configure.
#
# This ships with `plan: starter` and a persistent disk attached, because stable public counts
# require the database to survive a deploy. The disk is mounted at /var/data and OPPINTEL_DB
# points at it, so a deploy replaces the code, not the data.
#
# WHY A DISK IS REQUIRED FOR STABLE COUNTS: the database is SQLite (a file). On a host with no
# disk it is rebuilt from a bounded, partial ingest after every deploy, so a headline count taken
# before a deploy and again after it describes two different datasets. With the disk mounted at
# /var/data and OPPINTEL_DB pointing at it, a deploy replaces the code, not the data.
#
# A Blueprint that declares a `disk` on a Free instance does not apply at all, so the disk and the
# paid plan go together. If you must run without a disk, set `plan: free`, remove the `disk` block
# and remove both OPPINTEL_* variables below — otherwise the Blueprint is rejected.

services:
  - type: web
    name: buildscope
    runtime: python
    # Free has no disk and sleeps after inactivity. `starter` is the smallest paid plan that can
    # attach the persistent disk below, which is what keeps public counts stable across deploys.
    plan: starter
    region: oregon
    branch: main
    # Render injects RENDER=true; ops/start.sh detects it and runs in the foreground on $PORT.
    # It is idempotent, so it is safe on every boot against an existing database.
    buildCommand: pip install -r requirements.txt
    # Invoked through bash explicitly: the script uses bash syntax and this does not depend on
    # the executable bit surviving the deploy.
    startCommand: bash ops/start.sh
    healthCheckPath: /healthz
    # One instance, because the disk cannot be shared and two refresh loops must not race.
    numInstances: 1
    autoDeploy: true
    envVars:
      # The build only installs requirements.txt; the package itself is not pip-installed. src/ is
      # the import root, so setting it here makes the app and the Render Shell agree — the admin
      # command in the docs runs there without a prefix.
      - key: PYTHONPATH
        value: src
      # Signs sessions. Generated once by Render and kept, so logins survive a redeploy.
      - key: SECRET_KEY
        generateValue: true
      # Absolute canonical links, Open Graph tags and the sitemap. Only needed to override the
      # origin: without it the app uses RENDER_EXTERNAL_URL, and this takes precedence over that.
      # Set it for a custom domain.
      - key: BASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # The refresh loop: fetch the newest pages of every source every six hours.
      - key: REFRESH_SECONDS
        value: "21600"
      - key: MAX_PAGES
        value: "3"
      # The database lives on the mounted disk so it outlives a deploy. This is what makes the
      # public counts stable: without it the database is rebuilt from a bounded partial ingest
      # after every deploy and the headline numbers change between reads.
      - key: OPPINTEL_DATA_DIR
        value: /var/data
      - key: OPPINTEL_DB
        value: /var/data/oppintel.db
    # Persistent disk (REQUIRED to keep public counts stable across deploys). Requires a paid
    # instance type, which is why `plan` above is `starter` rather than `free`.
    disk:
      name: oppintel-data
      mountPath: /var/data
      sizeGB: 1
