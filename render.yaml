# Render blueprint for the BuildScope PREVIEW service.
#
# Deploy with "New > Blueprint" and point Render at this repository; it reads this file.
# The same container runs the web app and the online-search refresh loop, so there is no
# separate worker, cron job or external scheduler to configure.
#
# This is the FREE PREVIEW configuration:
#   * no persistent disk — the container filesystem is ephemeral, so the database is rebuilt
#     from scratch on every deploy/restart;
#   * the app therefore self-seeds on first boot from the public sources, bounded to the
#     24-month window declared in config/sources.yaml (since_months: 24), so the first pass
#     finishes quickly on a small instance;
#   * PREVIEW_MODE=1 shows a fixed "Preview build: data may reset on redeploy." banner on
#     every page.
#
# To keep the assembled dataset across deploys, use render.production.example.yaml instead
# (a paid instance type with a disk). Do not add a disk to this file: a Blueprint that declares
# a disk on a Free instance does not apply at all.

services:
  - type: web
    name: buildscope-preview
    runtime: python
    # Free has no disk and sleeps after inactivity. That is acceptable for a preview.
    plan: free
    region: oregon
    branch: main
    # Render injects RENDER=true; ops/start.sh detects it and runs in the foreground on $PORT.
    # initdb/init-app are idempotent, so this is safe on every boot against a fresh or existing DB.
    buildCommand: pip install -r requirements.txt
    # Invoked through bash explicitly: the script uses bash syntax and this does not depend on
    # the executable bit surviving the deploy.
    startCommand: bash ops/start.sh
    healthCheckPath: /healthz
    # One instance, because two refresh loops must not race against the same database file.
    numInstances: 1
    autoDeploy: true
    envVars:
      # The build only installs requirements.txt; the package itself is not pip-installed. src/ is
      # the import root, so setting it here makes the app and the Render Shell agree.
      - key: PYTHONPATH
        value: src
      # Signs sessions. Generated once by Render and kept, so logins survive a redeploy.
      - key: SECRET_KEY
        generateValue: true
      # Marks this as a preview: the app shows the "data may reset" banner.
      - key: PREVIEW_MODE
        value: "1"
      # Absolute canonical links, Open Graph tags and the sitemap. Only needed to override the
      # origin: without it the app uses RENDER_EXTERNAL_URL, and this takes precedence over that.
      - key: BASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_ENABLED
        value: "true"
      - key: GZIP_ENABLED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      # The refresh loop: fetch the newest pages of every source every six hours.
      - key: REFRESH_SECONDS
        value: "21600"
      # A bounded first pass for a small free instance. The 24-month window is applied at the
      # source (config/sources.yaml since_months: 24), so these pages stay inside that window.
      - key: MAX_PAGES
        value: "3"
      # Pin the depth: the progressive backfill is disabled on the preview, so the pass stays
      # bounded and predictable rather than widening on every successful run.
      - key: GROW_BACKFILL
        value: "0"
      # No disk: leave OPPINTEL_DATA_DIR / OPPINTEL_DB unset. The app writes to the checkout's
      # own data/ directory, which is writable; a path like /var/data does not exist here.

